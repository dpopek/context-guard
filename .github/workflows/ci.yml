name: Context-Guard Multi-OS CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.13"]
        exclude:
          - os: ubuntu-latest
            python-version: "3.9"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install pytest, mypy, and ruff
        run: python -m pip install --upgrade pip pytest mypy ruff

      - name: Run mypy type check (Python ${{ matrix.python-version }})
        run: python -m mypy --python-version ${{ matrix.python-version }} spool evidence hooks bin policies integrations tests

      - name: Run mypy type check (darwin, Python ${{ matrix.python-version }})
        run: python -m mypy --python-version ${{ matrix.python-version }} --platform darwin spool evidence hooks bin policies integrations

      - name: Run mypy type check (linux, Python ${{ matrix.python-version }})
        run: python -m mypy --python-version ${{ matrix.python-version }} --platform linux spool evidence hooks bin policies integrations

      - name: Run mypy type check (win32, Python ${{ matrix.python-version }})
        run: python -m mypy --python-version ${{ matrix.python-version }} --platform win32 spool evidence hooks bin policies integrations

      - name: Run ruff lint check
        run: python -m ruff check spool evidence hooks bin policies integrations tests

      - name: Run Node syntax check on VS Code extension
        run: python -c "import glob, shutil, subprocess; nb = shutil.which('node') or 'node'; fs = sorted(glob.glob('vscode-extension/*.js')); assert fs; [subprocess.run([nb, '--check', f], check=True) for f in fs]"

      - name: Run deterministic replay smoke check
        run: python bin/cg_status.py --replay

      - name: Run deterministic benchmark smoke check
        run: python bin/cg_status.py --benchmark

      - name: Run public-json scrubber smoke check
        run: python bin/cg_status.py --public-json

      - name: Run offline evidence replay smoke check
        run: python bin/cg.py eval --offline-replay --json

      - name: Run release hygiene check
        run: python -c "from bin.replay_benchmark import check_release_hygiene; issues = check_release_hygiene(); assert not issues, issues"

      - name: Run full test suite
        run: python -m pytest -q tests/
