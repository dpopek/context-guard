name: Context-Guard Multi-OS CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.13"]
        exclude:
          - os: ubuntu-latest
            python-version: "3.9"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install pytest, mypy, and ruff
        run: python -m pip install --upgrade pip pytest mypy ruff

      - name: Run mypy type check (Python ${{ matrix.python-version }})
        run: python -m mypy --python-version ${{ matrix.python-version }} core policies spool integrations hooks services evidence bin tests

      - name: Run mypy type check (darwin, Python ${{ matrix.python-version }})
        run: python -m mypy --python-version ${{ matrix.python-version }} --platform darwin core policies spool integrations hooks services evidence bin

      - name: Run mypy type check (linux, Python ${{ matrix.python-version }})
        run: python -m mypy --python-version ${{ matrix.python-version }} --platform linux core policies spool integrations hooks services evidence bin

      - name: Run mypy type check (win32, Python ${{ matrix.python-version }})
        run: python -m mypy --python-version ${{ matrix.python-version }} --platform win32 core policies spool integrations hooks services evidence bin

      - name: Run ruff lint check
        run: python -m ruff check core policies spool integrations hooks services evidence bin tests

      - name: Run Node syntax check on VS Code extension
        run: python -c "import glob, shutil, subprocess; nb = shutil.which('node') or 'node'; fs = sorted(glob.glob('vscode-extension/*.js')); assert fs; [subprocess.run([nb, '--check', f], check=True) for f in fs]"

      - name: Run deterministic replay smoke check
        run: python bin/cg_status.py --replay

      - name: Run deterministic benchmark smoke check
        run: python bin/cg_status.py --benchmark

      - name: Run public-json scrubber smoke check
        run: python bin/cg_status.py --public-json

      - name: Run offline evidence replay smoke check
        run: python bin/cg.py eval --offline-replay --json

      - name: Run adaptive governor replay smoke check
        run: python bin/cg.py eval --governor-check --json

      - name: Run explainability and hardening gate smoke check
        run: python bin/cg.py eval --hardening-check --json

      - name: Run cohesive doctor contract smoke check
        run: python bin/cg.py doctor --contracts --json

      - name: Run platform conformance smoke check
        run: python bin/cg.py eval --conformance --json

      - name: Run release hygiene check
        run: python -c "from services.replay_benchmark import check_release_hygiene; issues = check_release_hygiene(); assert not issues, issues"

      - name: Run full test suite
        run: python -m pytest -q tests/

  agent-ratchet:
    name: Agent-Ratchet Governance Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Run agent-ratchet against trusted base
        env:
          BASE_BRANCH: ${{ github.base_ref || 'main' }}
        run: |
          set -eu
          BASE_REF="origin/$BASE_BRANCH"
          git rev-parse --verify "$BASE_REF" >/dev/null || exit 1
          present=$(git ls-tree "$BASE_REF" -- guard.lock scripts/guard) || exit 1
          if [ -z "$present" ]; then
            shim=scripts/guard
          elif [ "$(printf '%s\n' "$present" | wc -l)" -eq 2 ]; then
            git show "$BASE_REF:scripts/guard" > "$RUNNER_TEMP/guard"
            shim="$RUNNER_TEMP/guard"
          else
            echo "broken install: $BASE_REF has only one of guard.lock, scripts/guard" >&2
            exit 1
          fi
          sh "$shim" --lock-from "$BASE_REF" scan --commit-range "$BASE_REF..HEAD"
          sh "$shim" --lock-from "$BASE_REF" baseline-integrity --require-base-ref --enforce-policy-isolation --commit-range "$BASE_REF..HEAD"
          sh "$shim" --lock-from "$BASE_REF" scan core policies spool integrations hooks services evidence bin tests

      - name: Smoke-test updated guard.lock or scripts/guard
        env:
          BASE_BRANCH: ${{ github.base_ref || 'main' }}
        run: |
          set -eu
          BASE_REF="origin/$BASE_BRANCH"
          if ! git diff --quiet "$BASE_REF...HEAD" -- guard.lock scripts/guard; then
            sh scripts/guard version --sha
            sh scripts/guard scan --commit-range "$BASE_REF..HEAD"
          fi
