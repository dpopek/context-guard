name: Context-Guard Multi-OS CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.13"]
        exclude:
          - os: ubuntu-latest
            python-version: "3.9"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install pytest, mypy, and ruff
        run: python -m pip install --upgrade pip pytest mypy ruff

      - name: Run static type and lint checks
        run: |
          python -m mypy hooks bin policies integrations tests
          python -m ruff check hooks bin policies integrations tests
          python -c "import glob, shutil, subprocess; nb = shutil.which('node') or 'node'; fs = sorted(glob.glob('vscode-extension/*.js')); assert fs; [subprocess.run([nb, '--check', f], check=True) for f in fs]"

      - name: Run replay, benchmark, public-json, and release hygiene smoke checks
        run: |
          python bin/cg_status.py --replay
          python bin/cg_status.py --benchmark
          python bin/cg_status.py --public-json
          python -c "from bin.replay_benchmark import check_release_hygiene; issues = check_release_hygiene(); assert not issues, issues"

      - name: Run full test suite
        run: python -m pytest -q tests/
