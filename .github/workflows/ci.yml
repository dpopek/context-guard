name: Context-Guard Multi-OS CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.13"]
        exclude:
          - os: ubuntu-latest
            python-version: "3.9"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pytest, mypy, and ruff
        run: python -m pip install --upgrade pip pytest mypy ruff

      - name: Run static type and lint checks
        run: |
          python -m mypy hooks bin tests
          python -m ruff check hooks bin tests

      - name: Run full test suite
        run: python -m pytest -q tests/
