[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.9"
files = ["hooks", "bin"]
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pytest", "_pytest", "_pytest.*"]
follow_imports = "skip"

[tool.ruff]
target-version = "py39"
line-length = 110
src = ["hooks", "bin", "tests"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
